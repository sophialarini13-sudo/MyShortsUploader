name: shorts
on:
  repository_dispatch:
    types: [make_shorts]
  workflow_dispatch:
    inputs:
      url:
        description: "Direct video link"
        required: true
      title:
        description: "Title"
        required: false
      tags:
        description: "Hashtags, comma se alag"
        required: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install google-api-python-client google-auth
      - name: Make and upload shorts
        run: python process.py
        env:
          VIDEO_URL: ${{ github.event.client_payload.url || inputs.url }}
          VIDEO_TITLE: ${{ github.event.client_payload.title || inputs.title }}
          VIDEO_TAGS: ${{ github.event.client_payload.tags || inputs.tags }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
